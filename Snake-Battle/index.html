<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fruit Eater Snake</title>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #07122e;
    --board: #0b1e4d;
    --border: #3b82f6;
    --text: #e8f0ff;
    --muted: #8fa7d6;
    --accent: #fbbf24;
    --btn: clamp(48px, min(15vw, 10dvh), 76px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    background: radial-gradient(circle at 50% 0%, #10245a 0%, var(--bg) 65%);
    background-color: var(--bg);
    color: var(--text);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  }

  /* ---------- Layout: portrait by default ---------- */
  .app {
    height: 100%;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-areas: "top" "stage" "bottom";
    gap: clamp(6px, 1.5vmin, 14px);
    padding: clamp(8px, 2vmin, 18px) max(clamp(8px, 2vmin, 18px), env(safe-area-inset-left, 0px)) clamp(8px, 2vmin, 18px) max(clamp(8px, 2vmin, 18px), env(safe-area-inset-right, 0px));
  }
  .top { grid-area: top; text-align: center; min-width: 0; }
  .stage { grid-area: stage; position: relative; min-width: 0; min-height: 0; }
  .bottom { grid-area: bottom; display: flex; flex-direction: column; align-items: center; gap: clamp(6px, 1.5vmin, 12px); }

  /* Landscape / wide screens: board on the left, panel on the right */
  @media (min-aspect-ratio: 11/10) {
    .app {
      grid-template-columns: minmax(0, 1fr) clamp(190px, 30vw, 320px);
      grid-template-rows: auto minmax(0, 1fr);
      grid-template-areas: "stage top" "stage bottom";
      column-gap: clamp(12px, 3vw, 32px);
    }
    .top { align-self: start; }
    .bottom { align-self: start; justify-content: flex-start; }
    .hud { flex-direction: column; }
    .stat { display: flex; justify-content: space-between; align-items: center; text-align: left; }
  }

  h1 { margin: 0 0 4px; font-size: clamp(20px, 4.6vmin, 34px); letter-spacing: 1px; line-height: 1.1; }
  .banner { height: clamp(26px, 6vmin, 46px); max-width: 80%; margin-bottom: 2px; filter: drop-shadow(0 0 6px rgba(120,170,255,.6)); }
  @media (max-height: 460px) { .banner { display: none; } }

  .hud { display: flex; gap: clamp(6px, 1.5vmin, 12px); width: 100%; max-width: 560px; margin: clamp(4px, 1vmin, 10px) auto 0; }
  .stat {
    flex: 1; min-width: 0; background: rgba(59,130,246,.12); border: 2px solid rgba(59,130,246,.45);
    border-radius: 14px; padding: clamp(3px, .9vmin, 7px) clamp(8px, 2vmin, 14px); text-align: center;
  }
  .stat small { display: block; color: var(--muted); font-size: clamp(9px, 1.9vmin, 12px); text-transform: uppercase; letter-spacing: 1.2px; }
  .stat b { font-size: clamp(16px, 4vmin, 26px); color: var(--accent); line-height: 1.2; }

  /* Board frame: sized by JS to the largest square that fits the stage */
  .frame {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 300px; height: 300px;
    border: var(--bw, 8px) solid var(--border);
    border-radius: var(--br, 32px);
    background: var(--board); overflow: hidden; touch-action: none;
    box-shadow: 0 0 0 3px #0a1a40, 0 0 28px rgba(59,130,246,.45), inset 0 0 30px rgba(0,0,0,.45);
    font-size: calc(var(--size, 300px) / 24);
  }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; }

  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: .5em; text-align: center; background: rgba(5,12,35,.8); padding: 1em;
  }
  .overlay.hidden { display: none; }
  .overlay h2 { margin: 0; font-size: 1.8em; line-height: 1.1; }
  .overlay p { margin: 0; color: var(--muted); font-size: .72em; line-height: 1.35; }
  .overlay img { width: 70%; max-height: 22%; object-fit: contain; filter: drop-shadow(0 0 8px rgba(120,170,255,.6)); }
  button { font-family: inherit; }
  button.play {
    background: var(--accent); color: #1b1300; border: 0; border-radius: 999px;
    padding: .55em 1.8em; font-size: 1em; font-weight: 700; cursor: pointer; margin: .2em 0;
    box-shadow: 0 .2em 0 #b88410;
  }
  button.play:active { transform: translateY(.15em); box-shadow: 0 .05em 0 #b88410; }

  .controls { display: flex; gap: 10px; align-items: center; justify-content: center; }
  button.pause {
    background: rgba(59,130,246,.18); color: var(--text); border: 2px solid rgba(59,130,246,.6);
    border-radius: 999px; padding: 5px 16px; font-size: clamp(12px, 2.6vmin, 16px); cursor: pointer;
  }
  button.pause:disabled { opacity: .4; cursor: default; }

  .pad { display: grid; grid-template-columns: repeat(3, var(--btn)); grid-template-rows: repeat(2, var(--btn)); gap: clamp(5px, 1.2vmin, 8px); }
  .pad button {
    border: 2px solid rgba(59,130,246,.6); background: rgba(59,130,246,.3); color: #fff;
    border-radius: 16px; font-size: calc(var(--btn) * .4); cursor: pointer; touch-action: manipulation; padding: 0;
  }
  .pad button:active { background: rgba(59,130,246,.55); }
  .pad .up { grid-column: 2; grid-row: 1; }
  .pad .left { grid-column: 1; grid-row: 2; }
  .pad .down { grid-column: 2; grid-row: 2; }
  .pad .right { grid-column: 3; grid-row: 2; }
  /* Arrow pad is ALWAYS visible (phones, tablets and desktops) */

  .hint { color: var(--muted); font-size: clamp(10px, 1.9vmin, 13px); text-align: center; }
  @media (max-height: 520px) and (max-aspect-ratio: 11/10) { .hint { display: none; } }
  /* Landscape: keep the side panel (stats + pause + arrows) fully on screen */
  @media (min-aspect-ratio: 11/10) {
    :root { --btn: clamp(38px, 13dvh, 64px); }
    .hint { display: none; }
    .stat { padding: 2px 10px; }
    .stat b { font-size: clamp(15px, 4.5dvh, 24px); }
    h1 { font-size: clamp(18px, 6dvh, 32px); }
  }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <img id="bannerImg" class="banner" alt="snake">
    <h1>Fruit Eater</h1>
    <div class="hud">
      <div class="stat"><small>Score</small><b id="score">0</b></div>
      <div class="stat"><small>Length</small><b id="length">3</b></div>
      <div class="stat"><small>Best</small><b id="best">0</b></div>
    </div>
  </div>

  <div class="stage" id="stage">
    <div class="frame" id="frame">
      <canvas id="game"></canvas>
      <div class="overlay" id="overlay">
        <img id="overlayImg" alt="snake">
        <h2 id="ovTitle">Fruit Eater</h2>
        <p id="ovText">Guide the snake to eat fruits and grow longer!</p>
        <button class="play" id="playBtn">Play</button>
        <p>Arrow keys / WASD / swipe &middot; Space to pause</p>
      </div>
    </div>
  </div>

  <div class="bottom">
    <div class="controls"><button class="pause" id="pauseBtn" disabled>&#10074;&#10074; Pause</button></div>
    <div class="pad">
      <button class="up" data-dir="up" aria-label="Up">&#9650;</button>
      <button class="left" data-dir="left" aria-label="Left">&#9664;</button>
      <button class="down" data-dir="down" aria-label="Down">&#9660;</button>
      <button class="right" data-dir="right" aria-label="Right">&#9654;</button>
    </div>
    <div class="hint">Each fruit = +10 points. Hitting a wall or yourself ends the game.</div>
  </div>
</div>

const FRUITS = ["apple.png", "mango.png", "watermelon.png", "orange.png", "strawberry.png", "banana.png"];
const images = {};
for (const name of Object.keys(IMAGE_SRC)) {
  const im = new Image();
  im.src = IMAGE_SRC[name];
  images[name] = im;
}
document.getElementById("bannerImg").src = IMAGE_SRC["snake.png"];
document.getElementById("overlayImg").src = IMAGE_SRC["snake.png"];

const stage = document.getElementById("stage");
const frame = document.getElementById("frame");
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const COLS = 20, ROWS = 20;
let CELL = 30;

const scoreEl = document.getElementById("score");
const lengthEl = document.getElementById("length");
const bestEl = document.getElementById("best");
const overlay = document.getElementById("overlay");
const ovTitle = document.getElementById("ovTitle");
const ovText = document.getElementById("ovText");
const playBtn = document.getElementById("playBtn");
const pauseBtn = document.getElementById("pauseBtn");

let snake = [], dir = {x: 1, y: 0}, queue = [], fruit = null, score = 0, best = 0;
let timer = null, running = false, paused = false, crashed = false, speed = 140, popups = [];

try { best = parseInt(localStorage.getItem("fruitSnakeBest") || "0", 10) || 0; } catch (e) {}
bestEl.textContent = best;

// ---------- Responsive sizing ----------
function resize() {
  const r = stage.getBoundingClientRect();
  const size = Math.floor(Math.max(140, Math.min(r.width, r.height)));
  frame.style.width = size + "px";
  frame.style.height = size + "px";
  frame.style.setProperty("--size", size + "px");
  frame.style.setProperty("--bw", Math.max(4, Math.min(10, size * 0.016)) + "px");
  frame.style.setProperty("--br", Math.max(14, size * 0.06) + "px");
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const px = Math.max(1, Math.round(canvas.clientWidth * dpr));
  if (canvas.width !== px) { canvas.width = px; canvas.height = px; }
  CELL = canvas.width / COLS;
}
if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 150));

// ---------- Game logic ----------
function reset() {
  snake = [{x: 9, y: 10}, {x: 8, y: 10}, {x: 7, y: 10}];
  dir = {x: 1, y: 0};
  queue = [];
  score = 0;
  speed = 140;
  popups = [];
  crashed = false;
  spawnFruit();
  updateHud();
}

function updateHud() {
  scoreEl.textContent = score;
  lengthEl.textContent = snake.length;
  bestEl.textContent = best;
}

function spawnFruit() {
  const free = [];
  for (let y = 0; y < ROWS; y++)
    for (let x = 0; x < COLS; x++)
      if (!snake.some(s => s.x === x && s.y === y)) free.push({x, y});
  if (!free.length) { fruit = null; return; }
  const p = free[Math.floor(Math.random() * free.length)];
  fruit = {x: p.x, y: p.y, type: FRUITS[Math.floor(Math.random() * FRUITS.length)]};
}

function start() {
  clearTimeout(timer);
  reset();
  overlay.classList.add("hidden");
  running = true; paused = false;
  pauseBtn.disabled = false;
  pauseBtn.innerHTML = "&#10074;&#10074; Pause";
  schedule();
}

function schedule() {
  clearTimeout(timer);
  timer = setTimeout(tick, speed);
}

function tick() {
  if (!running || paused) return;
  if (queue.length) dir = queue.shift();
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  const hitWall = head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS;
  // The tail cell is about to move away unless a fruit is eaten, so ignore it
  const eating = fruit && head.x === fruit.x && head.y === fruit.y;
  const body = eating ? snake : snake.slice(0, -1);
  const hitSelf = body.some(s => s.x === head.x && s.y === head.y);
  if (hitWall || hitSelf) return endGame(false);

  snake.unshift(head);
  if (eating) {
    score += 10;
    popups.push({x: fruit.x, y: fruit.y, life: 1});
    if (score > best) {
      best = score;
      try { localStorage.setItem("fruitSnakeBest", String(best)); } catch (e) {}
    }
    speed = Math.max(70, speed - 3);
    spawnFruit();
    if (!fruit) { updateHud(); return endGame(true); }
  } else {
    snake.pop();
  }
  updateHud();
  schedule();
}

function endGame(won) {
  running = false; paused = false;
  crashed = !won;
  clearTimeout(timer);
  pauseBtn.disabled = true;
  ovTitle.textContent = won ? "You Win!" : "Game Over";
  ovText.textContent = "Score " + score + " \u2022 Length " + snake.length;
  playBtn.textContent = "Play Again";
  overlay.classList.remove("hidden");
}

function setDir(name) {
  const map = {up: {x: 0, y: -1}, down: {x: 0, y: 1}, left: {x: -1, y: 0}, right: {x: 1, y: 0}};
  const d = map[name];
  if (!d || !running || paused) return;
  const last = queue.length ? queue[queue.length - 1] : dir;
  if (d.x === -last.x && d.y === -last.y) return; // no reversing
  if (d.x === last.x && d.y === last.y) return;   // same direction
  if (queue.length < 2) queue.push(d);
}

function togglePause() {
  if (!running) return;
  paused = !paused;
  if (paused) {
    clearTimeout(timer);
    ovTitle.textContent = "Paused";
    ovText.textContent = "Press Space or Resume to continue";
    playBtn.textContent = "Resume";
    overlay.classList.remove("hidden");
    pauseBtn.innerHTML = "&#9654; Resume";
  } else {
    overlay.classList.add("hidden");
    pauseBtn.innerHTML = "&#10074;&#10074; Pause";
    schedule();
  }
}

playBtn.addEventListener("click", () => { playBtn.blur(); running && paused ? togglePause() : start(); });
pauseBtn.addEventListener("click", () => { pauseBtn.blur(); togglePause(); });

document.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  const keys = {arrowup: "up", w: "up", arrowdown: "down", s: "down", arrowleft: "left", a: "left", arrowright: "right", d: "right"};
  if (keys[k]) { e.preventDefault(); setDir(keys[k]); }
  else if (k === " " || k === "enter") {
    e.preventDefault();
    if (e.repeat) return;
    if (!running) start(); else if (k === " ") togglePause();
  } else if (k === "p") togglePause();
});

document.querySelectorAll(".pad button").forEach(b => {
  b.addEventListener("pointerdown", e => { e.preventDefault(); setDir(b.dataset.dir); });
});

document.addEventListener("visibilitychange", () => { if (document.hidden && running && !paused) togglePause(); });

// Swipe on the board
let touch = null;
canvas.addEventListener("touchstart", e => { const t = e.touches[0]; touch = {x: t.clientX, y: t.clientY}; }, {passive: true});
canvas.addEventListener("touchmove", e => {
  e.preventDefault();
  if (!touch) return;
  const t = e.touches[0];
  const dx = t.clientX - touch.x, dy = t.clientY - touch.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) > 22) {
    setDir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
    touch = {x: t.clientX, y: t.clientY};
  }
}, {passive: false});
canvas.addEventListener("touchend", () => { touch = null; });

// ---------- Drawing ----------
function drawGrid() {
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      ctx.fillStyle = (x + y) % 2 ? "#0b1e4d" : "#0d2357";
      ctx.fillRect(Math.floor(x * CELL), Math.floor(y * CELL), Math.ceil(CELL), Math.ceil(CELL));
    }
  }
}

function drawFruit() {
  if (!fruit) return;
  const img = images[fruit.type];
  const cx = fruit.x * CELL + CELL / 2, cy = fruit.y * CELL + CELL / 2;
  const pulse = 1 + Math.sin(Date.now() / 220) * 0.06;
  if (img && img.complete && img.naturalWidth) {
    const box = CELL * 1.25 * pulse;
    const r = Math.min(box / img.naturalWidth, box / img.naturalHeight);
    const w = img.naturalWidth * r, h = img.naturalHeight * r;
    ctx.drawImage(img, cx - w / 2, cy - h / 2, w, h);
  } else {
    ctx.fillStyle = "#ef4444";
    ctx.beginPath(); ctx.arc(cx, cy, CELL * 0.4, 0, Math.PI * 2); ctx.fill();
  }
}

function drawSnake() {
  const n = snake.length;
  const grow = Math.min(0.12, n * 0.004);
  const baseR = CELL * (0.38 + grow);
  const pts = snake.map(s => ({x: s.x * CELL + CELL / 2, y: s.y * CELL + CELL / 2}));
  const outline = CELL * 0.08;

  for (const pass of [0, 1]) {
    for (let i = n - 1; i >= 0; i--) {
      const taper = 1 - (i / n) * 0.25;
      const r = baseR * taper + (pass === 0 ? outline : 0);
      ctx.fillStyle = pass === 0 ? "#5aa2ff" : (crashed ? "#1a1a1a" : "#000000");
      ctx.beginPath(); ctx.arc(pts[i].x, pts[i].y, r, 0, Math.PI * 2); ctx.fill();
      if (i < n - 1) {
        const a = pts[i], b = pts[i + 1];
        ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = r * 2; ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
    }
  }

  const h = pts[0], d = dir, px = -d.y, py = d.x;
  for (const side of [-1, 1]) {
    const ex = h.x + d.x * CELL * 0.14 + px * side * CELL * 0.2;
    const ey = h.y + d.y * CELL * 0.14 + py * side * CELL * 0.2;
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(ex, ey, CELL * 0.11, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(ex + d.x * CELL * 0.04, ey + d.y * CELL * 0.04, CELL * 0.055, 0, Math.PI * 2); ctx.fill();
  }
  if (!crashed) {
    ctx.strokeStyle = "#ff3b5c"; ctx.lineWidth = Math.max(1.5, CELL * 0.07); ctx.lineCap = "round";
    const tx = h.x + d.x * baseR, ty = h.y + d.y * baseR;
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(tx + d.x * CELL * 0.3, ty + d.y * CELL * 0.3); ctx.stroke();
  }
}

function drawPopups() {
  popups = popups.filter(p => p.life > 0);
  ctx.font = "bold " + Math.round(CELL * 0.75) + "px Trebuchet MS, sans-serif";
  ctx.textAlign = "center";
  for (const p of popups) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = "#fbbf24";
    const y = Math.max(CELL * 0.9, p.y * CELL - (1 - p.life) * CELL);
    ctx.fillText("+10", Math.min(canvas.width - CELL, Math.max(CELL, p.x * CELL + CELL / 2)), y);
    ctx.globalAlpha = 1;
    p.life -= 0.03;
  }
}

function loop() {
  drawGrid();
  if (snake.length) { drawFruit(); drawSnake(); drawPopups(); }
  requestAnimationFrame(loop);
}

reset();
resize();
loop();
</script>
</body>
</html>
